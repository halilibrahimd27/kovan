name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the UI script parses
        run: |
          python - <<'EOF'
          s = open('pano/static/index.html').read()
          open('ui.js', 'w').write(s[s.index('<script>') + 8:s.index('</script>')])
          EOF
          node --check ui.js
      - name: Package installs and runs
        run: |
          python -m pip install .
          pano --version
