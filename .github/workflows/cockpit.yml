# Kovan Cockpit — the zero-dependency control room under cockpit/.
# Independent of the swarm gauntlet (verify.yml): no Postgres, no uv, no Docker.
name: cockpit

on:
  push:
    paths: ["cockpit/**", ".github/workflows/cockpit.yml"]
  pull_request:
    paths: ["cockpit/**", ".github/workflows/cockpit.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: cockpit

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:          # 3.9 is the oldest supported Python; current Ubuntu runners start at 3.10
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the UI script parses
        run: |
          python - <<'EOF'
          s = open('kovan/static/index.html').read()
          open('ui.js', 'w').write(s[s.index('<script>') + 8:s.index('</script>')])
          EOF
          node --check ui.js
      - name: Package installs and runs
        run: |
          python -m pip install .
          kovan --version
